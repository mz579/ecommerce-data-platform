[project]
name = "ecommerce-data-platform"
version = "0.1.0"
description = "电商用户行为数据仓库与实时分析平台 —— Phase 0 工程骨架"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyyaml",
    "pymysql",
    "psycopg[binary]",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecommerce_dw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.format]
quote-style = "double"