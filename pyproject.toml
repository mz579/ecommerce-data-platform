[project]
name = "ecommerce-data-platform"
version = "0.1.0"
description = "电商用户行为数据仓库与实时分析平台 —— Phase 0 工程骨架"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyyaml",
    "pymysql",
    "psycopg[binary]",
    "python-dotenv",
    "confluent-kafka>=2.16.1",
    "jsonschema>=4.26.0",
    "rfc3339-validator>=0.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecommerce_dw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "web/backend"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests", "web/backend"]
# notebooks/ 由 scripts/build_eda_notebook.py 生成、nbconvert 执行产出，
# 内部展示型长行与 format 规则冲突，整目录豁免 lint 与 format。
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
]
