# ==================================================================
# ecommerce-data-platform — 数据仓库 + Airflow 编排 + Superset 看板（Phase 6-7）
#
# 服务：
#   - mysql    ：业务数仓（ODS/DWD/DWS/ADS 全在 MySQL，含各层控制表）
#   - postgres ：元数据库 meta（Airflow 元数据）+ 独立库 superset_meta（Superset
#                元数据，与业务库严格分离、与 Airflow 元库物理隔离）
#   - airflow-init     ：一次性初始化（建元库 schema + 幂等建管理员用户）
#   - airflow-scheduler：LocalExecutor 调度器（任务在调度器进程内线程执行）
#   - airflow-webserver：Web UI（树状视图 / 日志 / 触发 / 回填）
#   - superset-init    ：一次性初始化（建 superset_meta + db upgrade + 幂等管理员
#                        + 导入看板 JSON + 修正只读连接口令）
#   - superset         ：Web 看板（8088，只读账号查 ADS/受控视图，见 docs/superset_design.md）
#
# Airflow 架构决策见 docs/airflow_design.md；Superset 设计见 docs/superset_design.md。
# Credentials 用环境变量而非 UI Connections（CLI 本来就只读环境变量；Superset 的
# 业务连接口令由 superset-init 内 fix_database_password.py 从 env 重建并 Fernet 落库）。
#
# 镜像 tag 说明：禁止使用 :latest；Airflow 锁 apache/airflow:2.10.5-python3.11，
# Superset 锁 apache/superset:4.1.2（缺失 MySQL 驱动用最小 Dockerfile 补 pymysql）。
# 中国大陆拉取先走镜像源再打回标准名（见各 Dockerfile / 设计文档）。
# ==================================================================

name: ecommerce-data-platform

x-airflow-common: &airflow-common
  image: ecommerce-airflow:2.10.5-python3.11
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  restart: unless-stopped
  environment: &airflow-env
    # --- Airflow 运行时（元数据库 = postgres 容器的 meta 库） ---
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    # airflow-init 用这三个变量幂等创建管理员用户（仅 init 需要，共享 anchor 最简）
    AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_WWW_USER_USERNAME}
    AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_WWW_USER_PASSWORD}
    AIRFLOW_WWW_USER_EMAIL: ${AIRFLOW_WWW_USER_EMAIL}
    TZ: UTC
    # --- 业务数仓（容器内 host = mysql 服务名） ---
    # 项目全部 CLI（DAG 调用的真实脚本）都从 MYSQL_* 环境变量取连接配置
    MYSQL_HOST: mysql
    MYSQL_PORT: "3306"
    MYSQL_USER: ${MYSQL_USER}
    MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    MYSQL_DATABASE: ${MYSQL_DATABASE}
  volumes: &airflow-volumes
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./docker/airflow/init.sh:/opt/airflow/init.sh:ro
    - ./src:/opt/ecommerce_dw/src:ro
    - ./pyproject.toml:/opt/ecommerce_dw/pyproject.toml:ro
    - ./README.md:/opt/ecommerce_dw/README.md:ro
    - ./sql:/opt/ecommerce_dw/sql:ro
    - ./data:/opt/ecommerce_dw/data:ro
    - ./logs:/opt/ecommerce_dw/logs
    - ./.env:/opt/ecommerce_dw/.env:ro
    # Phase 8: DAG contract tests run inside the real scheduler runtime
    - ./tests:/opt/ecommerce_dw/tests:ro
    - airflow_logs:/opt/airflow/logs
  networks:
    - ecommerce-net
  depends_on:
    postgres:
      condition: service_healthy

x-superset-common: &superset-common
  image: ecommerce-superset:4.1.2
  build:
    context: .
    dockerfile: docker/superset/Dockerfile
  restart: "no"
  environment: &superset-env
    # 元数据库 = postgres 容器上的独立库 superset_meta（非 Airflow 的 meta 库）
    SUPERSET_META_DB_URI: postgresql+psycopg2://${SUPERSET_META_USER}:${SUPERSET_META_PASSWORD}@postgres:5432/${SUPERSET_META_DB}
    SUPERSET_META_DB: ${SUPERSET_META_DB}
    SUPERSET_META_USER: ${SUPERSET_META_USER}
    SUPERSET_META_PASSWORD: ${SUPERSET_META_PASSWORD}
    SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
    # superset-init 幂等创建管理员
    SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME}
    SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
    SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL}
    # init.sh Step 1 以 postgres 超管建库/建角色
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DB: ${POSTGRES_DB}
    # 业务数仓只读账号（Superset 不直连 ecom_app）
    MYSQL_RO_USER: ${MYSQL_RO_USER}
    MYSQL_RO_PASSWORD: ${MYSQL_RO_PASSWORD}
    MYSQL_DATABASE: ${MYSQL_DATABASE}
    SUPERSET_MYSQL_HOST: mysql
    SUPERSET_MYSQL_PORT: "3306"
    TZ: UTC
  volumes:
    - ./docker/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    - ./docker/superset/init.sh:/app/scripts/init.sh:ro
    - ./docker/superset/fix_database_password.py:/app/scripts/fix_database_password.py:ro
    - ./dashboards/exports:/opt/superset/exports:ro
    - superset_home:/app/superset_home
  networks:
    - ecommerce-net
  depends_on:
    postgres:
      condition: service_healthy

x-flink-common: &flink-common
  image: ecommerce-flink:1.20.1-scala_2.12-java17
  build:
    context: .
    dockerfile: docker/flink/Dockerfile
  restart: unless-stopped
  environment: &flink-env
    # 集群级配置。单机回放规模下：JM 768m / TM 1280m 进程内存，2 个 slot。
    # 具体上限依据 WSL2 实测见 docs/streaming_design.md §10.4。
    FLINK_PROPERTIES: |
      jobmanager.rpc.address: flink-jobmanager
      jobmanager.memory.process.size: 768m
      taskmanager.memory.process.size: 1280m
      taskmanager.numberOfTaskSlots: 2
      parallelism.default: 2
      rest.address: 0.0.0.0
      rest.bind-address: 0.0.0.0
      state.backend.type: hashmap
      state.checkpoints.dir: file:///opt/flink/checkpoints
      state.savepoints.dir: file:///opt/flink/savepoints
      state.checkpoints.num-retained: 3
      execution.checkpointing.interval: 10s
      execution.checkpointing.mode: EXACTLY_ONCE
      execution.checkpointing.min-pause: 5s
      execution.checkpointing.timeout: 60s
      # 作业 cancel/失败后保留 checkpoint 元数据，供 `flink run -s` 恢复。
      # Flink 1.20 的取值只有 DELETE_ON_CANCELLATION / RETAIN_ON_CANCELLATION /
      # NO_EXTERNALIZED_CHECKPOINTS；RETAIN_ON_CANCELLATION 的官方语义是
      # “cancel 或失败都保留”，因此不需要也不存在单独的 RETAIN_ON_FAILURE。
      # 保留的 checkpoint 不受 num-retained 自动清理，清理策略见设计文档 §6.3。
      execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
    TZ: UTC
    # Phase 9.3：Flink 业务作业写入 ecommerce_rt 的 JDBC 连接参数。
    # 密码只从 .env 插值（RT_MYSQL_PASSWORD 优先，回退 RT_APP_PASSWORD），不进镜像/仓库。
    RT_MYSQL_URL: ${RT_MYSQL_URL:-jdbc:mysql://mysql:3306/ecommerce_rt}
    RT_MYSQL_USER: ${RT_MYSQL_USER:-rt_app}
    RT_MYSQL_PASSWORD: ${RT_MYSQL_PASSWORD:-${RT_APP_PASSWORD}}
  volumes:
    - flink_checkpoints:/opt/flink/checkpoints
    - flink_savepoints:/opt/flink/savepoints
    # 宿主机构建好的作业 jar（scripts/build_flink_job.sh），只读挂载给 JM/TM。
    - ./build/flink-jobs:/opt/flink/jobs:ro
  networks:
    - ecommerce-net

services:
  mysql:
    image: mysql:8.0.43
    container_name: ecommerce-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 数据卷为空时，镜像首次启动自动执行初始化脚本（建库 + utf8mb4 字符集）
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - ecommerce-net

  postgres:
    image: postgres:16.13
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - ecommerce-net

  # 一次性初始化：airflow db migrate + 幂等建管理员。退出码 0 即完成。
  airflow-init:
    <<: *airflow-common
    container_name: ecommerce-airflow-init
    restart: "no"
    command: ["bash", "/opt/airflow/init.sh"]

  airflow-scheduler:
    <<: *airflow-common
    container_name: ecommerce-airflow-scheduler
    command: ["scheduler"]
    # Phase 8 hardening: never start scheduling before the one-shot init has
    # finished migrating the metadata DB and before the business MySQL is healthy.
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $$(cat /etc/hostname)"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s

  airflow-webserver:
    <<: *airflow-common
    container_name: ecommerce-airflow-webserver
    command: ["webserver"]
    # Same ordering contract as the scheduler (init complete + MySQL healthy).
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "${AIRFLOW_UI_PORT:-8080}:8080"
    # 基础镜像不保证有 curl/wget，用 python urllib 探测 /health
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8080/health',timeout=5)\""]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s

  # 一次性初始化：建 superset_meta 库 + db upgrade + 幂等管理员 + 导入看板 JSON +
  # 修正只读连接口令。退出码 0 即完成；可重复执行（幂等）。空元库一键重建命令：
  #   docker compose up -d --force-recreate superset-init && docker compose up -d superset
  superset-init:
    <<: *superset-common
    container_name: ecommerce-superset-init
    restart: "no"
    command: ["bash", "/app/scripts/init.sh"]

  superset:
    <<: *superset-common
    container_name: ecommerce-superset
    restart: unless-stopped
    command: ["/usr/bin/run-server.sh"]
    ports:
      - "${SUPERSET_UI_PORT:-8088}:8088"
    # 基础镜像不保证有 curl/wget，用 python urllib 探测 /health（返回 200）
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8088/health',timeout=5)\""]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 45s
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully

  # ==================================================================
  # Phase 9.1：实时基础设施（Kafka KRaft 单节点 + Flink standalone session）
  #
  # - 不依赖、不修改现有 MySQL/PostgreSQL/Airflow/Superset 五服务；
  # - Kafka 仅单节点 KRaft（无 ZooKeeper），内外部双 listener：
  #     容器内（Flink/后续作业）  kafka:9092
  #     宿主机控制台/调试        localhost:${KAFKA_PORT:-9092} -> 容器 19092
  # - Flink 采用 standalone session（JM + 1 TM），作业用 `flink run` 提交，
  #   不在 compose 里长驻业务作业；checkpoint/savepoint 落命名卷。
  # 设计、容量与验收见 docs/streaming_design.md。
  # ==================================================================
  kafka:
    image: apache/kafka:3.9.1
    container_name: ecommerce-kafka
    restart: unless-stopped
    mem_limit: 1g
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      # 仅开发/回放环境；生产集群应放入独立 secret 管理
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-5L6g3nShT-eMCtK--X86sw}
      # 堆上限由 WSL2 资源实测决定（见设计文档 §10.4），非拍脑袋值
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      TZ: UTC
    ports:
      - "${KAFKA_PORT:-9092}:19092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s
    networks:
      - ecommerce-net

  flink-jobmanager:
    <<: *flink-common
    container_name: ecommerce-flink-jobmanager
    command: ["jobmanager"]
    mem_limit: 1g
    ports:
      - "${FLINK_UI_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/overview >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  flink-taskmanager:
    <<: *flink-common
    container_name: ecommerce-flink-taskmanager
    command: ["taskmanager"]
    mem_limit: 1536m
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pgrep -f org.apache.flink.runtime.taskexecutor.TaskExecutor >/dev/null",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ==================================================================
  # Phase 11：Web UI（只读展示层）
  #
  # - 单容器同时提供 /api/* 与前端 SPA（FastAPI 托管 dist）；
  # - 业务连接固定为只读账号 webapp_ro（scripts/create_webapp_ro.py 初始化）；
  # - 不依赖/不修改现有 6 个服务，仅等待 mysql healthy；
  # - 宿主端口 ${WEB_UI_PORT:-8090}，容器内固定 8090。
  # ==================================================================
  web:
    image: ecommerce-web:1.0.0
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        # auto=容器内构建（失败回退预构建 dist）；prebuilt=直接用 dist；
        # build=强制构建；skip=占位页（仅验证后端）
        WEB_FRONTEND_MODE: ${WEB_FRONTEND_MODE:-auto}
    container_name: ecommerce-web
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      RT_DATABASE: ${RT_DATABASE:-ecommerce_rt}
      # 只读账号（绝不复用 ecom_app / MYSQL_PASSWORD）
      WEB_DB_USER: ${WEB_DB_USER:-webapp_ro}
      WEB_DB_PASSWORD: ${WEB_DB_PASSWORD}
      WEB_STATIC_DIR: /app/static
      WEB_LOG_LEVEL: ${WEB_LOG_LEVEL:-INFO}
      TZ: UTC
    ports:
      - "${WEB_UI_PORT:-8090}:8090"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8090/api/health',timeout=5)\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 15s
    networks:
      - ecommerce-net

volumes:
  mysql_data:
  postgres_data:
  airflow_logs:
  superset_home:
  kafka_data:
  flink_checkpoints:
  flink_savepoints:

networks:
  ecommerce-net:
    driver: bridge